name: Create release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      RELEASE_NAME: caelestia-shell-${{ github.ref_name }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Build release archive
        run: |
          mkdir -p ".release/$RELEASE_NAME"
          rsync -av --exclude={'.*',nix,flake.lock,flake.nix} . ".release/$RELEASE_NAME"
          echo "$GITHUB_SHA" > ".release/$RELEASE_NAME/REVISION"
          tar -C .release -czf "$RELEASE_NAME.tar.gz" "$RELEASE_NAME"
          cp "$RELEASE_NAME.tar.gz" caelestia-shell-latest.tar.gz

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.RELEASE_NAME }}.tar.gz
            caelestia-shell-latest.tar.gz
          generate_release_notes: true

      - name: Update stable branch
        run: |
          git branch -f stable "$GITHUB_SHA"
          git push origin stable --force

  windows-installer:
    needs: build-and-release
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.3"
          arch: win64_msvc2022_64
          modules: "qtshadertools"
          cache: true

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: ./windows/scripts/installer.ps1 -QtDir $env:QT_ROOT_DIR

      - name: Attach installer to release
        uses: softprops/action-gh-release@v3
        with:
          files: windows/dist/*.exe
